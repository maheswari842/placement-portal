version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: placement_portal_db
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: placement_portal
    networks:
      - placement_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: placement_portal_backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/placement_portal
      - JWT_SECRET=your_super_secret_jwt_key_change_in_production
      - NODE_ENV=production
    depends_on:
      - mongodb
    networks:
      - placement_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: placement_portal_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - placement_network

volumes:
  mongodb_data:

networks:
  placement_network:
    driver: bridge
